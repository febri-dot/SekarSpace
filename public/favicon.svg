<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#541A1A"/>
      <stop offset="100%" stop-color="#7A2626"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E9DF"/>
      <stop offset="100%" stop-color="#DCC3AA"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded Base Icon Background -->
  <rect width="64" height="64" rx="16" fill="url(#maroonGrad)"/>
  
  <!-- Outer Decorative Ring -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Stylized House Roof & Contour -->
  <path d="M 32 12 L 48 25 L 48 46 C 48 49 45 52 42 52 L 22 52 C 19 52 16 49 16 46 L 16 25 Z" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Chimney -->
  <path d="M 41 19 L 41 15 L 45 15 L 45 22.5" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Blooming Flower Petals / Heart inside House -->
  <!-- Top Petal -->
  <path d="M 32 24 C 29 27 29 32 32 35 C 35 32 35 27 32 24 Z" fill="url(#goldGrad)"/>
  
  <!-- Left Petal -->
  <path d="M 26 29 C 23 32 25 36 29 37 C 29 34 28 30 26 29 Z" fill="url(#goldGrad)" opacity="0.9"/>
  
  <!-- Right Petal -->
  <path d="M 38 29 C 41 32 39 36 35 37 C 35 34 36 30 38 29 Z" fill="url(#goldGrad)" opacity="0.9"/>
  
  <!-- Central Heart Shape -->
  <path d="M 32 46 C 32 46 23 40 23 34 C 23 31 25.5 29 28.5 29 C 30.5 29 31.5 30 32 31 C 32.5 30 33.5 29 35.5 29 C 38.5 29 41 31 41 34 C 41 40 32 46 32 46 Z" fill="#DCC3AA"/>
</svg>
