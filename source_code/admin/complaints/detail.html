<!DOCTYPE html>
<html lang="id">

<head>

    <title>Detail Keluhan - Sekar Space</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #F1E2D1;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        h1,
        h2 {
            color: #541A1A;
        }

        p {
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 10px;
            margin-top: 10px;
        }

        button {
            margin-top: 10px;
            padding: 8px 16px;
            border: none;
            background-color: #541A1A;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        .back-btn {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Detail Keluhan</h1>

        <section>
            <h2>Informasi Keluhan</h2>

            <p><strong>Nama Penyewa:</strong> Keyla Asyfa Zahra</p>

            <p>
                <strong>Keluhan:</strong><br>
                AC kamar sudah tidak dingin sejak kemarin malam dan membuat kamar terasa panas.
            </p>
        </section>

        <section>
            <h2>Balas Keluhan</h2>

            <form>
                <textarea placeholder="Tulis balasan..."></textarea>
                <br>
                <button type="submit">Kirim Balasan</button>

        <a href="index.html" class="back-btn">

</html>
